<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Confirmed | JP's Magic Cleaning</title>
  <style>
    :root {
      --bg: #f3f9fc;
      --card: #ffffff;
      --text: #123047;
      --muted: #5f7485;
      --primary: #006496;
      --accent: #00AFDC;
      --accent-dark: #008db0;
      --border: #cfe7f0;
      --shadow: 0 18px 50px rgba(0, 100, 150, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(0, 175, 220, 0.16), transparent 30%),
        linear-gradient(180deg, #fafdff 0%, var(--bg) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid rgba(207, 231, 240, 0.85);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
    }

    .brand {
      width: min(1100px, 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--primary);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 20px 48px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 48px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 175, 220, 0.10), transparent 38%);
      pointer-events: none;
    }

    .icon-wrap {
      width: 78px;
      height: 78px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background: rgba(0, 175, 220, 0.14);
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 175, 220, 0.28);
    }

    .icon {
      width: 34px;
      height: 34px;
      color: var(--primary);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 2.9rem);
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 520px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .brand {
        justify-content: center;
      }

      .card {
        padding: 40px 22px;
        border-radius: 20px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">JP's Magic Cleaning</div>
      </div>
  </header>

  <main>
    <section class="card" aria-labelledby="confirmation-title">
      <div class="icon-wrap" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 7L9 18L4 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="confirmation-title">Your request has been confirmed!</h1>
      <p>We will follow up via email or text to confirm the request.</p>

      <div class="actions">
        <a class="btn btn-primary" href="https://www.jpsmagiccleaning.com">Back to Home</a>
        </div>

      <div class="footer-note">Thank you for choosing JP's Magic Cleaning.</div>
    </section>
  </main>
</body>
</html>
